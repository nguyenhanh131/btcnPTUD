<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐẠI HỌC UEH</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        div.at-container {
            display: flex;
            flex-direction: column;   /* xếp logo và chữ theo cột dọc */
            align-items: center;
            justify-content: center;
            gap: 16px;                /* khoảng cách giữa logo và chữ */
            height: 100%;
        }

        .at-item {
            color: #3079ed;
            font-weight: bold;
            font-size: 3em;

            animation-name: text-shadow-multicolor2;
            animation-duration: 1s;
            animation-timing-function: linear;
            animation-delay: 0s;
            animation-iteration-count: 1;
            animation-direction: normal;
            animation-fill-mode: forwards;

            /* shorthand
            animation: text-shadow-multicolor2 1s linear 0s 1 normal forwards; */
        }

        @keyframes text-shadow-multicolor2 {
            0% {
                text-shadow: 0 0 black, 0 0 red, 0 0 orange, 0 0 yellow,
                             0 0 green, 0 0 skyblue, 0 0 blue, 0 0 white;
                transform: translateX(0) translateY(0);
            }
            100% {
                text-shadow: -1px -1px black, -3px -3px red, -5px -5px orange, -7px -7px yellow,
                             -9px -9px green, -11px -11px skyblue, -13px -13px blue, -15px -15px white;
                transform: translateX(8px) translateY(8px);
            }
        }
    </style>

    <!-- Thư viện hiệu ứng animate.css -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
</head>

<body>
    <div class="at-container">
        <!-- Logo: xoay vào, lặp mãi mãi (animate.css) -->
        <img class="animate__animated animate__rotateIn animate__infinite"
             src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
             alt="logo Khoa Công nghệ thông tin">

        <!-- Chữ UEH: bóng nhiều màu (@keyframes tự viết) -->
        <div class="at-item">ĐẠI HỌC UEH</div>
    </div>
</body>

</html>
