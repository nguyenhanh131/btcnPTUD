
<!DOCTYPE html>
<html>

<head>
    <title>Tạo responsive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .left,
        .right {
            height: 400px;
        }

        .left {
            background: blue;
            float: left;
            width: 70%;
        }

        .right {
            background: red;
            float: right;
            width: 30%;
        }

        @media only screen and (max-width: 768px) {
            .left, .right {
                width: 100%;
            }
        }

        @media only screen and (min-width: 320px) and (max-width: 480px) {
            .right {
                display: none;
            }
        }

        @media only print {
            .left {
                display: none;
            }

            .right {
                width: 100%;
                background: red !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left">
            <picture>
                <source media="(min-width: 800px)" srcset="https://ueh.edu.vn/images/logo-header.png">
                <source media="(min-width: 600px)" srcset="https://ctd.ueh.edu.vn/wp-content/uploads/2024/06/Thumbnail_logo-CTD-385x256.png">
                <img alt="Logo UEH" src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png" width="400">
            </picture>
            LEFT
        </div>

        <div class="right">RIGHT</div>
    </div>
</body>

</html>
