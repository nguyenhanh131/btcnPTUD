<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Flappy Bird – HatCoffee Edition</title>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body>
    <div id="container">
        <div id="bird"></div>
        <div id="pole_1" class="pole"></div>
        <div id="pole_2" class="pole"></div>
        <span id="level">Level 1</span>
        <span id="best">Kỷ lục: 0</span>
        <div id="message"></div>
        <button id="play_btn">Click vào để chơi<br><small>(phím ↓ để vỗ cánh)</small></button>
        <span id="score">0</span>
    </div>
    <button id="restart_btn">Chơi lại</button>
    <script src="js/jquery.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
