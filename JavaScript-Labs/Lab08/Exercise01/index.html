<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 8.1 – Bật/Tắt JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Bài 8.1 · Bật/Tắt JavaScript</h1>

        <div id="status" class="status off">You have JavaScript disabled</div>

        <h2>Cách bật/tắt</h2>
        <ul>
            <li><strong>Chrome:</strong> DevTools → <code>Cmd + Shift + P</code> → "Disable JavaScript" → tải lại trang.</li>
            <li><strong>Firefox:</strong> <code>about:config</code> → <code>javascript.enabled</code> → true/false.</li>
            <li><strong>Safari:</strong> Develop → Disable JavaScript.</li>
        </ul>

        <h2>Minh chứng</h2>
        <figure>
            <img src="../images/8-1-enabled.png" alt="JavaScript enabled">
            <figcaption>Bật JavaScript</figcaption>
        </figure>
        <figure>
            <img src="../images/8-1-disabled.png" alt="JavaScript disabled">
            <figcaption>Tắt JavaScript</figcaption>
        </figure>
    </main>

    <script src="script.js"></script>
</body>
</html>
